spring.application.name=auth-service
# Server configuration
server.port=${PORT:8084}
# Logging
logging.level.root=INFO
# Actuator: expose all endpoints over HTTP and show health details
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
# Datasource configuration for PostgreSQL
# Use environment variables with sensible defaults so runtime can override credentials
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:1236}/${DB_NAME:mintrade-auth}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JWT Configuration
jwt.secret=MyJwtSecretKey12345MyJwtSecretKey12345MyJwtSecretKey12345
jwt.expiration=3600000

