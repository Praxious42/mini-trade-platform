spring.application.name=execution-service
# Server configuration
server.port=${PORT:8082}
# Logging
logging.level.root=INFO
# Actuator: expose all endpoints over HTTP and show health details
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
# Kafka bootstrap
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
spring.kafka.consumer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.consumer.group-id=execution-service-group
spring.kafka.listener.concurrency=1
# Use string keys and JSON values
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer explicit configuration (ensure listener receives String payloads)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# During local testing, start from earliest to avoid missing messages
spring.kafka.consumer.auto-offset-reset=earliest
# Kafka debug logging for diagnostics (remove or set to INFO in production)
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO
