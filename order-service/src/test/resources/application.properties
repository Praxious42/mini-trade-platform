spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
kafka.topic.names=orders.created,orders.cancelled,orders.filled,orders.rejected
kafka.topic.enabled=false
portfolio.grpc.host=${PORTFOLIO_GRPC_HOST:portfolio-service}
portfolio.grpc.port=${PORTFOLIO_GRPC_PORT:8085}
