spring.application.name=order-service
# Server configuration
server.port=${PORT:8081}
# Logging
logging.level.root=INFO
# Actuator: expose all endpoints over HTTP and show health details
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
# Datasource configuration for PostgreSQL
# Use environment variables with sensible defaults so runtime can override credentials
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:1234}/${DB_NAME:mintrade-order}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Kafka bootstrap
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
spring.kafka.consumer.group-id=order-service-group
# Use string keys and JSON values
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# During local testing, start from earliest to avoid missing messages
spring.kafka.consumer.auto-offset-reset=earliest
# grpc client configuration
portfolio.grpc.host=localhost
portfolio.grpc.port=8085
