name: CI

on:
    pull_request:
    push:
        branches: [ "main" ]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: build-and-test
        runs-on: ubuntu-latest

        # Testcontainers needs Docker; ubuntu-latest runners have it available.
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Temurin JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "21"
                    cache: maven

            # Recommended for Testcontainers stability/perf on CI:
            # - reuse can speed things up within a single job
            # - disabling Ryuk can help in some restricted environments; GitHub-hosted runners usually work either way
            -   name: Configure Testcontainers
                run: |
                    echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV
                    echo "TESTCONTAINERS_REUSE_ENABLE=true" >> $GITHUB_ENV

            -   name: Build + Test (Maven)
                run: mvn -B -ntp verify
