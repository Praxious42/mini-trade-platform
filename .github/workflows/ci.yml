name: CI

on:
    pull_request:
    push:
        branches: [ "main" ]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: build-and-test
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Temurin JDK 17
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "17"
                    cache: maven

            -   name: Configure Testcontainers
                run: |
                    echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV
                    echo "TESTCONTAINERS_REUSE_ENABLE=true" >> $GITHUB_ENV

            -   name: Start infra (Docker Compose)
                run: |
                    docker compose -f infra/docker/docker-compose.yml up -d
                    # wait a bit for services to register
                    sleep 5

            -   name: Start services (Docker Compose)
                run: |
                    docker compose -f infra/docker/docker-compose.services.yml up -d --build
                    # give services a moment to become healthy
                    sleep 10

            -   name: Build + Test (Maven)
                env:
                    KAFKA_BOOTSTRAP_SERVERS: localhost:9092
                    PORTFOLIO_GRPC_HOST: localhost
                    DB_HOST: 127.0.0.1
                run: ./mvnw -B -ntp verify
